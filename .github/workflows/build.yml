name: Build Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            ext: exe
          - os: ubuntu-latest
            platform: linux
            ext: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:linux

      - name: Rename artifact (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          cd dist
          EXE=$(ls *.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            DATE=$(date +%y%m%d)
            mv "$EXE" "MiaoKeDaEC_${DATE}_x64_1.0.0.exe"
          fi
          ls -la

      - name: Rename artifact (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd dist
          APP=$(ls *.AppImage 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mv "$APP" "MiaoKeDaEC-1.0.0.AppImage"
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoKeDaEC-${{ matrix.platform }}
          path: dist/*.${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
